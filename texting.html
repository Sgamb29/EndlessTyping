<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Relax and Text</title>
</head>
<body>
    <div class="container">
        <h1 id="title" class="title">Endless Texting</h1>

        <p id="timeOutput">Your time will show up here.</p>
        
        <p id="output">Text Goes Here</p>
        <input type="text" id="input" placeholder="Press Here and Start Texting" autocapitalize="off">

        <fieldset class="optionsToggle" id="optionsToggle">
            <input id="toggleUppercase" type="checkbox" name="toggleUppercase">
            <label for="toggleUppercase">Include Uppercase</label>
            <br>
            <input id="toggleNumbers" type="checkbox" name="toggleNumbers">
            <label for="toggleNumbers">Include Numbers</label>
        </fieldset>
        
        <a id="homeLink" href="index.html">Back To Endless Typing</a>

    </div>

    <script src="scriptTexting.js"></script>
</body>
</html>
